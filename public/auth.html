<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auth Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            margin-top: 20px;
        }

        input {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: text;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 35%;
        }

        .token {
            display: none;
        }

        .creds {
            display: inline;
        }
    </style>
</head>

<body>
    <header>Auth setup</header>
    <div class="input-container">
        <label for="env_url">Environment:</label>
        <input type="text" id="env_url" name="env_url">

        <label for="token" class="token">Bearer token:</label>
        <input type="text" id="token" name="token" class="token">

        <label for="id" class="creds">Client ID:</label>
        <input type="text" id="id" name="id" class="creds">

        <label for="secret" class="creds">Client secret:</label>
        <input type="text" id="secret" name="secret" class="creds">

        <div>
            <button onClick="login()">Login</button>
            <button onClick="swapTokenInput()">Switch authentication mode</button>
        </div>
    </div>

    <!-- All inline for quick implementation, would be cleaner to have separate JS file to read this all from -->
    <script>
        let authMode = "creds";
        const buildEnvUrl = (envName) => {
            return `https://${envName}.chili-publish.online/grafx/api/v1/environment/${envName}`;
        }
        async function login() {
            // Check authMode, determines how auth token is being set
            let token;
            if (authMode == "token") {
                token = document.getElementById("token").value;
            } else {
                // later: add some error handling for bad credentials, this assumes correct values are always passed in
                const response = await fetch('https://integration-login.chiligrafx.com/oauth/token', {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        'grant_type': 'client_credentials',
                        'audience': 'https://chiligrafx.com',
                        'client_id': document.getElementById("id").value,
                        'client_secret': document.getElementById("secret").value,
                    })
                });

                const data = await response.json();
                token = data.access_token;
            }
            try {
                const response = await fetch(`auth`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        "environmentURL": buildEnvUrl(document.getElementById("env_url").value),
                        "token": token
                    })
                });
                const data = await response.json();
                console.log(data);

                if (data.success == true) {
                    // Reload the page after processing the response
                    setTimeout(() => window.location.reload(), 200);
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        // For switching between directly giving a bearer token or using client credentials login (if you have an integration user setup)
        function swapTokenInput() {
            // Check current auth mode, swap which class is hidden
            if (authMode == "token") {
                authMode = "creds";

                Array.from(document.getElementsByClassName("token")).forEach(element => {
                    element.style.display = "none";
                });
                Array.from(document.getElementsByClassName("creds")).forEach(element => {
                    element.style.display = "inline";
                });
            } else {
                authMode = "token";

                Array.from(document.getElementsByClassName("token")).forEach(element => {
                    element.style.display = "inline";
                });
                Array.from(document.getElementsByClassName("creds")).forEach(element => {
                    element.style.display = "none";
                });

            }
        }
    </script>
</body>

</html>
